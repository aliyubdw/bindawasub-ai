<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bindawasub AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .login h2 { margin-top: 0; color: #087f5b; }
    .login p { color: #555; font-size: 14px; }
    .login input { width: 100%; margin-bottom: 10px; }
    .login button { width: 100%; }
    .login-error { color: #b00020; font-size: 14px; margin-top: 10px; }
    .logout-button { float: right; background: rgba(255,255,255,0.18); padding: 7px 10px; font-size: 12px; }

    .chat {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .header {
      background: #087f5b;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .user {
      background: #dff5ec;
      margin-left: auto;
    }

    .bot {
      background: #f0f0f0;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #087f5b;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .product-list {
      margin-top: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-card {
      width: 100%;
      background: white;
      color: #087f5b;
      border: 2px solid #087f5b;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .product-card:hover {
      background: #e9f8f2;
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-name {
      font-weight: bold;
      font-size: 16px;
    }

    .product-details {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .product-price {
      font-weight: bold;
      font-size: 16px;
      margin-top: 6px;
    }

    .confirm-button {
      display: block;
      width: 85%;
      margin: 5px 0 12px auto;
      background: #087f5b;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel-button {
      display: block;
      width: 85%;
      margin: 5px 0 12px auto;
      background: #eeeeee;
      color: #333;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="login" id="loginScreen">
  <h2>🤖 Bindawasub AI</h2>
  <p>Shiga cikin asusunka domin amfani da Bindawasub.</p>
  <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
  <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginButton" type="button">Login</button>
  <div id="loginError" class="login-error"></div>
</div>

<div class="chat" id="chatScreen" style="display:none;">

  <div class="header">
    <button id="logoutButton" class="logout-button" type="button">Logout</button>
    <h2>🤖 Bindawasub AI</h2>
    <p>Sannu! Ta yaya zan taimaka maka?</p>
  </div>

  <div id="messages">

    <div class="message bot">
      Sannu! Barka da zuwa Bindawasub. Ta yaya zan taimaka maka yau?
    </div>

  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Rubuta saƙonka..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://fuktxjweuanatmurlzpg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_S1iARs058S3_XAUP1S_0Lw_oEnJuFe2";

const EDGE_FUNCTION_URL =
  "https://fuktxjweuanatmurlzpg.supabase.co/functions/v1/bindawasub-ai";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

async function getAccessToken() {
  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error || !data.session) {
    throw new Error("Ba a shiga cikin asusu ba.");
  }

  return data.session.access_token;
}

async function callEdgeFunction(payload) {
  const token = await getAccessToken();

  return fetch(EDGE_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_PUBLISHABLE_KEY,
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(payload)
  });
}

async function loginUser() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorBox = document.getElementById("loginError");
  const loginButton = document.getElementById("loginButton");

  errorBox.textContent = "";

  if (!email || !password) {
    errorBox.textContent = "Shigar da email da password."; 
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Ana shiga...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    errorBox.textContent = error.message;
    loginButton.disabled = false;
    loginButton.textContent = "Login";
    return;
  }

  showChatScreen();
}

async function logoutUser() {
  await supabaseClient.auth.signOut();
  document.getElementById("chatScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("loginPassword").value = "";
}

function showChatScreen() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("chatScreen").style.display = "flex";
  document.getElementById("messageInput").focus();
}

async function initAuth() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    showChatScreen();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session) {
      showChatScreen();
    } else {
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
    }
  });
}

/* =========================================
   CURRENT ORDER
========================================= */


/* =========================================
   CURRENT ORDER
========================================= */

let selectedProduct = null;
let recipientPhone = null;
let waitingForPhone = false;
let waitingForConfirmation = false;


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(text, type) {

  const messages =
    document.getElementById("messages");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent =
    text;

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================
   SHOW CLICKABLE PRODUCTS
========================================= */

function showProducts(products) {

  const messages =
    document.getElementById("messages");

  const productList =
    document.createElement("div");

  productList.className =
    "product-list";


  products.forEach(product => {

    const card =
      document.createElement("button");

    card.className =
      "product-card";

    card.type =
      "button";


    card.innerHTML = `

      <div class="product-name">
        ${product.product_name}
      </div>

      <div class="product-details">
        ${product.duration || ""}
      </div>

      <div class="product-price">
        ₦${Number(product.selling_price).toLocaleString()}
      </div>

    `;


    /* =========================================
       PACKAGE CLICK
    ========================================= */

    card.onclick = function() {

      selectedProduct = product;

      waitingForPhone = true;

      waitingForConfirmation = false;


      addMessage(
        `Na zabi ${product.product_name}`,
        "user"
      );


      addMessage(
        `Ka turo min lambar wayar da za a saka data.

Misali: 08012345678`,
        "bot"
      );


      const input =
        document.getElementById("messageInput");

      input.placeholder =
        "Shigar da lambar wayar...";

      input.focus();


      productList.remove();

    };


    productList.appendChild(card);

  });


  messages.appendChild(productList);

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================
   VALIDATE NIGERIAN PHONE NUMBER
========================================= */

function validatePhone(phone) {

  let number =
    phone.replace(/\s+/g, "")
         .replace(/-/g, "");


  if (number.startsWith("+234")) {

    number =
      "0" + number.substring(4);

  }


  else if (number.startsWith("234")) {

    number =
      "0" + number.substring(3);

  }


  if (
    /^0[789][0-9]{9}$/.test(number)
  ) {

    return number;

  }


  return null;
}


/* =========================================
   SHOW ORDER CONFIRMATION
========================================= */

function showConfirmation() {

  const messages =
    document.getElementById("messages");


  const box =
    document.createElement("div");

  box.className =
    "message bot";


  box.textContent =
`Ga bayanan sayayyarka:

${selectedProduct.product_name}
Farashi: ₦${Number(selectedProduct.selling_price).toLocaleString()}
Lamba: ${recipientPhone}

Kana tabbatar da wannan sayayya?`;


  messages.appendChild(box);


  /* =========================================
     CONFIRM BUTTON
  ========================================= */

  const confirm =
    document.createElement("button");

  confirm.className =
    "confirm-button";

  confirm.textContent =
    "✅ Eh, tabbatar da sayayya";


  confirm.onclick =
    async function() {

      addMessage(
        "Eh, na tabbatar.",
        "user"
      );


      confirm.disabled = true;


      if (cancel) {
        cancel.disabled = true;
      }


      addMessage(
        "Ana sarrafa sayayyar... Kada ka rufe shafin.",
        "bot"
      );


      try {

        /* =====================================
           CREATE UNIQUE TRANSACTION REFERENCE
        ===================================== */

        const reference =
          "BW-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 8);


        /* =====================================
           PROCESS WALLET PURCHASE
        ===================================== */

        const response = await callEdgeFunction({
          action: "purchase",
          product_id: selectedProduct.id,
          phone_number: recipientPhone,
          reference: reference
        });


        const data =
          await response.json();


        /* =====================================
           PURCHASE SUCCESS
        ===================================== */

        if (
          response.ok &&
          data.success &&
          data.purchase
        ) {

          const purchase =
            data.purchase;


          addMessage(
            `✅ An karɓi sayayyar.

Package: ${selectedProduct.product_name}
Lamba: ${recipientPhone}
Farashi: ₦${Number(
              purchase.purchase_amount
            ).toLocaleString()}

Balance kafin sayayya: ₦${Number(
              purchase.balance_before
            ).toLocaleString()}

Balance bayan sayayya: ₦${Number(
              purchase.balance_after
            ).toLocaleString()}

Transaction status: ${purchase.status}

Reference: ${purchase.reference}

A halin yanzu sayayyar tana jiran VTU processing. Ba a tura data zuwa provider ba tukuna.`,
            "bot"
          );

        }


        /* =====================================
           PURCHASE ERROR
        ===================================== */

        else {

          addMessage(
            "❌ An kasa kammala sayayyar.\n\n" +
            (
              data.error ||
              "Unknown error"
            ),
            "bot"
          );


          confirm.disabled = false;


          if (cancel) {
            cancel.disabled = false;
          }


          return;
        }

      }


      catch (error) {

        console.error(error);


        addMessage(
          "❌ An samu matsala wajen haɗawa da tsarin sayayya.",
          "bot"
        );


        confirm.disabled = false;


        if (cancel) {
          cancel.disabled = false;
        }


        return;
      }


      waitingForConfirmation =
        false;


      selectedProduct =
        null;


      recipientPhone =
        null;


      confirm.remove();


      if (cancel) {
        cancel.remove();
      }

    };


  messages.appendChild(confirm);


  /* =========================================
     CANCEL BUTTON
  ========================================= */

  const cancel =
    document.createElement("button");

  cancel.className =
    "cancel-button";

  cancel.textContent =
    "❌ A'a, canza bayanai";


  cancel.onclick =
    function() {

      addMessage(
        "A'a, ina son canza bayanin.",
        "user"
      );


      addMessage(
        "To, ka sake zabar package ko ka turo sabon lambar waya.",
        "bot"
      );


      selectedProduct = null;

      recipientPhone = null;

      waitingForPhone = false;

      waitingForConfirmation = false;


      confirm.remove();

      cancel.remove();


      const input =
        document.getElementById("messageInput");

      input.placeholder =
        "Rubuta saƙonka...";

    };


  messages.appendChild(cancel);


  waitingForConfirmation =
    true;

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(customMessage = null) {

  const input =
    document.getElementById("messageInput");

  const button =
    document.getElementById("sendButton");


  const message =
    customMessage ||
    input.value.trim();


  if (!message) return;


  /* =========================================
     PHONE NUMBER STAGE
  ========================================= */

  if (
    waitingForPhone &&
    !customMessage
  ) {

    const phone =
      validatePhone(message);


    addMessage(
      message,
      "user"
    );


    input.value = "";


    if (!phone) {

      addMessage(
        `Lambar wayar ba ta dace ba.

Ka shigar da lambar Najeriya mai lamba 11.

Misali: 08012345678`,
        "bot"
      );


      input.focus();

      return;

    }


    recipientPhone =
      phone;


    waitingForPhone =
      false;


    showConfirmation();


    input.placeholder =
      "Rubuta saƙonka...";


    input.focus();

    return;

  }


  /* =========================================
     NORMAL MESSAGE
  ========================================= */

  if (!customMessage) {

    addMessage(
      message,
      "user"
    );

    input.value = "";

  }


  button.disabled = true;


  /* =========================================
     LOADING
  ========================================= */

  const messages =
    document.getElementById("messages");

  const loading =
    document.createElement("div");

  loading.className =
    "message bot";

  loading.textContent =
    "Ana tunani...";


  messages.appendChild(loading);

  messages.scrollTop =
    messages.scrollHeight;


  try {

    /* =========================================
       SEND TO SUPABASE
    ========================================= */

    const response = await callEdgeFunction({
      message: message
    });


    const data =
      await response.json();


    loading.remove();


    /* =========================================
       BOT RESPONSE
    ========================================= */

    if (data.answer) {

      addMessage(
        data.answer,
        "bot"
      );

    }

    else if (data.error) {

      addMessage(
        "Backend error: " +
        data.error,
        "bot"
      );

    }

    else {

      addMessage(
        "Unexpected response:\n" +
        JSON.stringify(
          data,
          null,
          2
        ),
        "bot"
      );

    }


    /* =========================================
       SHOW PACKAGES
    ========================================= */

    if (
      data.products &&
      data.products.length > 0
    ) {

      showProducts(
        data.products
      );

    }

  }


  catch (error) {

    loading.remove();


    addMessage(
      "An samu matsala wajen haɗawa da Bindawasub AI.",
      "bot"
    );


    console.error(error);

  }


  button.disabled = false;

  input.focus();

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================
   ENTER KEY
========================================= */

document
  .getElementById("loginButton")
  .addEventListener("click", loginUser);

document
  .getElementById("logoutButton")
  .addEventListener("click", logoutUser);

document
  .getElementById("loginPassword")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") loginUser();
  });

initAuth();

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        sendMessage();

      }

    }
  );

</script>

</body>
</html>
