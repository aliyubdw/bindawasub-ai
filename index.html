<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bindawasub AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .header {
      background: #087f5b;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .user {
      background: #dff5ec;
      margin-left: auto;
    }

    .bot {
      background: #f0f0f0;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #087f5b;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Clickable product cards */
    .product-list {
      margin-top: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-card {
      width: 100%;
      background: white;
      color: #087f5b;
      border: 2px solid #087f5b;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .product-card:hover {
      background: #e9f8f2;
    }

    .product-card:active {
      transform: scale(0.98);

      font-weight: bold;
      font-size: 16px;

    .product-details {
      font-size: 13px;

    }

    .product-price {
      font-weight: bold;
      font-size: 16px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<div class="chat">

  <div class="header">
    <h2>🤖 Bindawasub AI</h2>
    <p>Sannu! Ta yaya zan taimaka maka?</p>
  </div>

  <div id="messages">

    <div class="message bot">
      Sannu! Barka da zuwa Bindawasub. Ta yaya zan taimaka maka yau?
    </div>

  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Rubuta saƙonka..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>

</div>

<script>

const EDGE_FUNCTION_URL =
  "https://fuktxjweuanatmurlzpg.supabase.co/functions/v1/bindawasub-ai";


/* =========================================
   DISPLAY CLICKABLE PRODUCTS
========================================= */

function showProducts(products) {

  const messages = document.getElementById("messages");

  const productList = document.createElement("div");

  productList.className = "product-list";


  products.forEach(product => {

    const card = document.createElement("button");

    card.className = "product-card";

    card.type = "button";


    card.innerHTML = `

      <div class="product-name">
        ${product.product_name}
      </div>

      <div class="product-details">
        ${product.duration || ""}
      </div>

      <div class="product-price">
        ₦${Number(product.selling_price).toLocaleString()}
      </div>

    `;


    /* =========================================
       WHEN CUSTOMER CLICKS PACKAGE
    ========================================= */

    card.onclick = function() {

      /* Show customer's selection */

      const userMessage =
        document.createElement("div");

      userMessage.className = "message user";

      userMessage.textContent =
        `I want ${product.product_name}`;

      messages.appendChild(userMessage);


      /* Send selection to backend */

      sendMessage(
        `I want ${product.product_name}`
      );

    };


    productList.appendChild(card);

  });


  messages.appendChild(productList);

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(customMessage = null) {

  const input =
    document.getElementById("messageInput");

  const button =
    document.getElementById("sendButton");

  const messages =
    document.getElementById("messages");


  /* Use custom message when package is clicked */

  const message =
    customMessage || input.value.trim();


  if (!message) return;


  /* =========================================
     SHOW NORMAL CUSTOMER MESSAGE
     Package clicks are already displayed above.
  ========================================= */

  if (!customMessage) {

    const userMessage =
      document.createElement("div");

    userMessage.className =
      "message user";

    userMessage.textContent =
      message;

    messages.appendChild(userMessage);

    input.value = "";

  }


  /* Disable send button */

  button.disabled = true;


  /* =========================================
     LOADING MESSAGE
  ========================================= */

  const loading =
    document.createElement("div");

  loading.className =
    "message bot";

  loading.textContent =
    "Ana tunani...";

  messages.appendChild(loading);

  messages.scrollTop =
    messages.scrollHeight;


  try {

    /* =========================================
       SEND REQUEST TO SUPABASE
    ========================================= */

    const response =
      await fetch(
        EDGE_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    /* =========================================
       READ RESPONSE
    ========================================= */

    const data =
      await response.json();


    loading.remove();


    /* =========================================
       BOT MESSAGE
    ========================================= */

    const botMessage =
      document.createElement("div");

    botMessage.className =
      "message bot";


    if (data.answer) {

      botMessage.textContent =
        data.answer;

    }

    else if (data.error) {

      botMessage.textContent =
        "Backend error: " +
        data.error;

    }

    else {

      botMessage.textContent =
        "Unexpected response:\n" +
        JSON.stringify(
          data,
          null,
          2
        );

    }


    messages.appendChild(botMessage);


    /* =========================================
       SHOW CLICKABLE PACKAGES
    ========================================= */

    if (
      data.products &&
      data.products.length > 0
    ) {

      showProducts(
        data.products
      );

    }

  }


  catch (error) {

    loading.remove();


    const errorMessage =
      document.createElement("div");

    errorMessage.className =
      "message bot";

    errorMessage.textContent =
      "An samu matsala wajen haɗawa da Bindawasub AI.";


    messages.appendChild(
      errorMessage
    );

    console.error(error);

  }


  /* =========================================
     RE-ENABLE SEND BUTTON
  ========================================= */

  button.disabled = false;

  input.focus();

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================
   ENTER KEY SUPPORT
========================================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }
  );

</script>

</body>
</html>
