<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bindawasub AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .login h2 { margin-top: 0; color: #087f5b; }
    .login p { color: #555; font-size: 14px; }
    .login input { width: 100%; margin-bottom: 10px; }
    .login button { width: 100%; }
    .login-error { color: #b00020; font-size: 14px; margin-top: 10px; }
    .logout-button { float: right; background: rgba(255,255,255,0.18); padding: 7px 10px; font-size: 12px; }

    .chat {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .header {
      background: #087f5b;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .user {
      background: #dff5ec;
      margin-left: auto;
    }

    .bot {
      background: #f0f0f0;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #087f5b;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .product-list {
      margin-top: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-card {
      width: 100%;
      background: white;
      color: #087f5b;
      border: 2px solid #087f5b;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .product-card:hover {
      background: #e9f8f2;
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-name {
      font-weight: bold;
      font-size: 16px;
    }

    .product-details {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .product-price {
      font-weight: bold;
      font-size: 16px;
      margin-top: 6px;
    }

    .confirm-button {
      display: block;
      width: 85%;
      margin: 5px 0 12px auto;
      background: #087f5b;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }


    .admin-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      font-size: 12px;
      font-weight: bold;
    }

    .admin-panel {
      display: none;
      padding: 12px;
      border-bottom: 1px solid #ddd;
      background: #f7fbf9;
      max-height: 38vh;
      overflow-y: auto;
    }

    .admin-panel h3 {
      margin: 0 0 10px;
      color: #087f5b;
      font-size: 16px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .admin-panel input,
    .admin-panel textarea {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      border: 1px solid #ccd5d1;
      border-radius: 8px;
      font-size: 14px;
    }

    .admin-panel button {
      width: 100%;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .admin-customer {
      padding: 9px;
      margin-bottom: 7px;
      border: 1px solid #d8e0dc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .admin-customer:hover {
      border-color: #087f5b;
    }

    .admin-selected {
      padding: 9px;
      margin: 8px 0;
      border-radius: 8px;
      background: #e9f8f2;
      color: #14533f;
      font-size: 13px;
    }

    .admin-status {
      font-size: 12px;
      margin: 4px 0 8px;
    }

    .admin-success { color: #126b42; }
    .admin-error { color: #a61b1b; }

    /* ADMIN MODE: hide customer-only chat UI */
    #customerInterface {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #customerInterface.admin-hidden {
      display: none !important;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .input-area {
      flex: 0 0 auto;
      width: 100%;
    }

    .chat.admin-mode #adminPanel {
      flex: 1;
      max-height: none;
      overflow-y: auto;
    }

    @media (max-width: 420px) {
      .admin-grid { grid-template-columns: 1fr; }
    }

    .cancel-button {
      display: block;
      width: 85%;
      margin: 5px 0 12px auto;
      background: #eeeeee;
      color: #333;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="login" id="loginScreen">
  <h2>🤖 Bindawasub AI</h2>
  <p>Shiga cikin asusunka domin amfani da Bindawasub.</p>
  <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
  <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginButton" type="button">Login</button>
  <div id="loginError" class="login-error"></div>
</div>

<div class="chat" id="chatScreen" style="display:none;">

  <div class="header">
    <button id="logoutButton" class="logout-button" type="button">Logout</button>
    <h2>🤖 Bindawasub AI</h2>
    <p id="headerSubtitle">Sannu! Ta yaya zan taimaka maka?</p>
    <div id="adminBadge" class="admin-badge" style="display:none;">ADMIN MODE</div>

  <div id="adminPanel" class="admin-panel">
    <h3>Admin Features</h3>
    <div id="adminStatus" class="admin-status"></div>

    <input id="adminCustomerSearch" type="text" placeholder="Search customer by name or phone">
    <button id="adminSearchButton" type="button">Search Customer</button>
    <div id="adminCustomerResults"></div>

    <div id="adminSelectedCustomer" class="admin-selected" style="display:none;"></div>

    <div class="admin-grid">
      <input id="adminFundAmount" type="number" min="1" step="0.01" placeholder="Funding amount (₦)">
      <input id="adminFundNote" type="text" placeholder="Funding note (optional)">
    </div>
    <button id="adminFundButton" type="button" disabled>Fund Customer Wallet</button>

    <div class="admin-grid">
      <input id="adminResetEmail" type="email" placeholder="Customer email">
      <input id="adminResetPassword" type="password" placeholder="New password (8+ chars)">
    </div>
    <button id="adminResetButton" type="button">Reset Customer Password</button>

    <div id="adminActionMessage" class="admin-status"></div>
  </div>

  <div id="customerInterface">
    <div id="messages">

      <div class="message bot">
        Sannu! Barka da zuwa Bindawasub. Ta yaya zan taimaka maka yau?
      </div>

    </div>

    <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Rubuta saƙonka..."
      autocomplete="off"
    >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://fuktxjweuanatmurlzpg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_S1iARs058S3_XAUP1S_0Lw_oEnJuFe2";

const EDGE_FUNCTION_URL =
  "https://fuktxjweuanatmurlzpg.supabase.co/functions/v1/bindawasub-ai";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

async function getAccessToken() {
  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error || !data.session) {
    throw new Error("Ba a shiga cikin asusu ba.");
  }

  return data.session.access_token;
}

async function callEdgeFunction(payload) {
  const token = await getAccessToken();

  return fetch(EDGE_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_PUBLISHABLE_KEY,
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(payload)
  });
}

async function loginUser() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorBox = document.getElementById("loginError");
  const loginButton = document.getElementById("loginButton");

  errorBox.textContent = "";

  if (!email || !password) {
    errorBox.textContent = "Shigar da email da password.";
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Ana shiga...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error || !data.session) {
    errorBox.textContent = error?.message || "Login failed.";
    loginButton.disabled = false;
    loginButton.textContent = "Login";
    return;
  }

  // Do NOT show the customer interface first.
  // Determine admin/customer mode before displaying the app.
  try {
    const isAdmin = await verifyAdminMode();

    showChatScreen();

    if (isAdmin) {
      document.getElementById("customerInterface").classList.add("admin-hidden");
    } else {
      document.getElementById("customerInterface").classList.remove("admin-hidden");
    }
  } catch (error) {
    console.error("Post-login setup failed:", error);
    await supabaseClient.auth.signOut();
    errorBox.textContent = "An kasa tabbatar da asusun. Sake gwadawa.";
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("chatScreen").style.display = "none";
    loginButton.disabled = false;
    loginButton.textContent = "Login";
    return;
  }

  loginButton.disabled = false;
  loginButton.textContent = "Login";
}

async function logoutUser() {
  await supabaseClient.auth.signOut();
  document.getElementById("chatScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("loginPassword").value = "";
  hideAdminMode();
}

function showChatScreen() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("chatScreen").style.display = "flex";
  if (!isAdminUser) {
    document.getElementById("messageInput").focus();
  }
}

async function initAuth() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    try {
      const isAdmin = await verifyAdminMode();
      showChatScreen();

      if (isAdmin) {
        document.getElementById("customerInterface").classList.add("admin-hidden");
      } else {
        document.getElementById("customerInterface").classList.remove("admin-hidden");
      }
    } catch (error) {
      console.error("Session setup failed:", error);
      await supabaseClient.auth.signOut();
    }
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    console.log("Auth event:", event, "has session:", !!session);

    // Only a real signed-in/initial session should display the app.
    if ((event === "SIGNED_IN" || event === "INITIAL_SESSION") && session) {
      setTimeout(async () => {
        try {
          const isAdmin = await verifyAdminMode();
          showChatScreen();

          if (isAdmin) {
            document.getElementById("customerInterface").classList.add("admin-hidden");
          } else {
            document.getElementById("customerInterface").classList.remove("admin-hidden");
          }
        } catch (error) {
          console.error("Auth setup failed:", error);
        }
      }, 0);
    }

    // Do NOT log the user out on TOKEN_REFRESHED or other transient auth events.
    if (event === "SIGNED_OUT") {
      hideAdminMode();
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
    }
  });
}

/* =========================================
   ADMIN MODE
========================================= */

const RESET_PASSWORD_FUNCTION_URL =
  "https://fuktxjweuanatmurlzpg.supabase.co/functions/v1/admin-reset-password";

let isAdminUser = false;
let adminSelectedCustomer = null;

async function verifyAdminMode() {
  try {
    const response = await callEdgeFunction({ action: "admin_status" });
    const data = await response.json();

    if (!response.ok || data.success !== true) {
      throw new Error(data.error || "Admin status check failed.");
    }

    isAdminUser = data.is_admin === true && data.role === "admin";

    if (isAdminUser) {
      document.getElementById("chatScreen").classList.add("admin-mode");
      document.getElementById("customerInterface").classList.add("admin-hidden");
      document.getElementById("adminBadge").style.display = "inline-block";
      document.getElementById("adminPanel").style.display = "block";
      document.getElementById("headerSubtitle").textContent =
        "Admin mode — customer tools are available below.";
      document.getElementById("adminStatus").textContent =
        "Logged in as " + (data.user?.name || "Admin");
    }

    return isAdminUser;
  } catch (error) {
    console.error("Admin mode check failed:", error);
    return false;
  }
}

async function adminCall(payload) {
  if (!isAdminUser) throw new Error("Admin access required.");
  const response = await callEdgeFunction(payload);
  const data = await response.json();
  if (!response.ok || data.success === false) {
    throw new Error(data.error || "Admin request failed.");
  }
  return data;
}

function showAdminMessage(message, isError = false) {
  const box = document.getElementById("adminActionMessage");
  box.textContent = message || "";
  box.className = "admin-status " + (isError ? "admin-error" : "admin-success");
}

function selectAdminCustomer(customer) {
  adminSelectedCustomer = customer;
  const wallet = Array.isArray(customer.wallets) ? customer.wallets[0] : customer.wallets;
  const balance = Number(wallet?.balance || 0);

  const box = document.getElementById("adminSelectedCustomer");
  box.style.display = "block";
  box.textContent =
    (customer.name || "Unnamed customer") +
    " • " +
    (customer.phone || "No phone") +
    " • Balance: ₦" +
    balance.toLocaleString();

  document.getElementById("adminFundButton").disabled = false;
}

async function searchAdminCustomers() {
  const query = document.getElementById("adminCustomerSearch").value.trim();
  const results = document.getElementById("adminCustomerResults");

  results.innerHTML = "";
  showAdminMessage("");

  if (!query) {
    showAdminMessage("Enter a customer name or phone number.", true);
    return;
  }

  const button = document.getElementById("adminSearchButton");
  button.disabled = true;
  button.textContent = "Searching...";

  try {
    const data = await adminCall({
      action: "customer_search",
      search: query
    });

    const customers = data.customers || [];

    if (!customers.length) {
      results.textContent = "No customer found.";
      return;
    }

    customers.forEach(customer => {
      const item = document.createElement("div");
      item.className = "admin-customer";

      const wallet = Array.isArray(customer.wallets)
        ? customer.wallets[0]
        : customer.wallets;

      item.textContent =
        (customer.name || "Unnamed customer") +
        " — " +
        (customer.phone || "No phone") +
        " — ₦" +
        Number(wallet?.balance || 0).toLocaleString();

      item.onclick = () => selectAdminCustomer(customer);
      results.appendChild(item);
    });
  } catch (error) {
    showAdminMessage(error.message || "Customer search failed.", true);
  } finally {
    button.disabled = false;
    button.textContent = "Search Customer";
  }
}

async function fundAdminCustomer() {
  if (!adminSelectedCustomer) {
    showAdminMessage("Select a customer first.", true);
    return;
  }

  const amount = Number(document.getElementById("adminFundAmount").value);
  const note = document.getElementById("adminFundNote").value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    showAdminMessage("Enter a valid funding amount.", true);
    return;
  }

  const customerName = adminSelectedCustomer.name || adminSelectedCustomer.phone || "customer";
  if (!window.confirm(
    "Fund " + customerName + "'s wallet with ₦" +
    amount.toLocaleString() + "?"
  )) return;

  const button = document.getElementById("adminFundButton");
  button.disabled = true;
  button.textContent = "Funding...";

  try {
    const reference =
      "FUND-" +
      new Date().toISOString().replace(/[-:TZ.]/g, "").slice(0, 14) +
      "-" +
      Math.random().toString(36).substring(2, 8).toUpperCase();

    const data = await adminCall({
      action: "manual_fund",
      customer_user_id: adminSelectedCustomer.id,
      amount,
      reference,
      note: note || null
    });

    const balanceAfter = Number(data.funding?.balance_after || 0);
    document.getElementById("adminSelectedCustomer").textContent =
      (adminSelectedCustomer.name || "Unnamed customer") +
      " • " +
      (adminSelectedCustomer.phone || "No phone") +
      " • Balance: ₦" +
      balanceAfter.toLocaleString();

    document.getElementById("adminFundAmount").value = "";
    document.getElementById("adminFundNote").value = "";

    showAdminMessage(
      "Wallet funded successfully. New balance: ₦" +
      balanceAfter.toLocaleString()
    );
  } catch (error) {
    showAdminMessage(error.message || "Wallet funding failed.", true);
  } finally {
    button.disabled = !adminSelectedCustomer;
    button.textContent = "Fund Customer Wallet";
  }
}

async function resetAdminCustomerPassword() {
  const email = document.getElementById("adminResetEmail").value.trim();
  const password = document.getElementById("adminResetPassword").value;

  if (!email || password.length < 8) {
    showAdminMessage("Enter a customer email and a password of at least 8 characters.", true);
    return;
  }

  if (!window.confirm("Reset the password for " + email + "?")) return;

  const button = document.getElementById("adminResetButton");
  button.disabled = true;
  button.textContent = "Resetting...";

  try {
    const token = await getAccessToken();
    const response = await fetch(RESET_PASSWORD_FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (!response.ok || data.success === false) {
      throw new Error(data.error || "Password reset failed.");
    }

    document.getElementById("adminResetPassword").value = "";
    showAdminMessage("Password reset successfully for " + email + ".");
  } catch (error) {
    showAdminMessage(error.message || "Password reset failed.", true);
  } finally {
    button.disabled = false;
    button.textContent = "Reset Customer Password";
  }
}

function hideAdminMode() {
  isAdminUser = false;
  adminSelectedCustomer = null;
  document.getElementById("chatScreen").classList.remove("admin-mode");
  document.getElementById("customerInterface").classList.remove("admin-hidden");
  document.getElementById("adminBadge").style.display = "none";
  document.getElementById("adminPanel").style.display = "none";
  document.getElementById("headerSubtitle").textContent =
    "Sannu! Ta yaya zan taimaka maka?";
}

    document.getElementById("messages");

  message.className =
    "message " + type;

  message.textContent =
    text;

  messages.appendChild(message);

  messages.scrollTop =

   SHOW CLICKABLE PRODUCTS
========================================= */

/* =========================================
   VALIDATE NIGERIAN PHONE NUMBER
========================================= */

function validatePhone(phone) {

  let number =
    phone.replace(/\s+/g, "")
         .replace(/-/g, "");


  if (number.startsWith("+234")) {

    number =
      "0" + number.substring(4);

  }


  else if (number.startsWith("234")) {

    number =
      "0" + number.substring(3);

  }


  if (
    /^0[789][0-9]{9}$/.test(number)
  ) {

    return number;

  }


  return null;
}

        ===================================== */

        const response = await callEdgeFunction({
          action: "purchase",
          product_id: selectedProduct.id,
          phone_number: recipientPhone,
          reference: reference
        });


        const data =
          await response.json();


        /* =====================================
           PURCHASE SUCCESS
        ===================================== */

        if (
          response.ok &&
          data.success &&
          data.purchase
        ) {

          const purchase =
            data.purchase;


          addMessage(
            `✅ An karɓi sayayyar.

Package: ${selectedProduct.product_name}
Lamba: ${recipientPhone}
Farashi: ₦${Number(
              purchase.purchase_amount
            ).toLocaleString()}

Balance kafin sayayya: ₦${Number(
              purchase.balance_before
            ).toLocaleString()}

Balance bayan sayayya: ₦${Number(
              purchase.balance_after
            ).toLocaleString()}

Transaction status: ${purchase.status}

Reference: ${purchase.reference}

A halin yanzu sayayyar tana jiran VTU processing. Ba a tura data zuwa provider ba tukuna.`,
            "bot"
          );

        }


        /* =====================================
           PURCHASE ERROR
        ===================================== */

        else {

          addMessage(
            "❌ An kasa kammala sayayyar.\n\n" +
            (
              data.error ||
              "Unknown error"
            ),
            "bot"
          );


          confirm.disabled = false;


          if (cancel) {
            cancel.disabled = false;
          }


          return;
        }

      }


      catch (error) {

        console.error(error);


        addMessage(
          "❌ An samu matsala wajen haɗawa da tsarin sayayya.",
          "bot"
        );


        confirm.disabled = false;


        if (cancel) {
          cancel.disabled = false;
        }


        return;
      }


      waitingForConfirmation =
        false;


      selectedProduct =
        null;


      recipientPhone =
        null;


      confirm.remove();


      if (cancel) {
        cancel.remove();
      }

    };


  messages.appendChild(confirm);


  /* =========================================
     CANCEL BUTTON
  ========================================= */

  const cancel =
    document.createElement("button");

  cancel.className =
    "cancel-button";

  cancel.textContent =
    "❌ A'a, canza bayanai";


  cancel.onclick =
    function() {

      addMessage(
        "A'a, ina son canza bayanin.",
        "user"
      );


      addMessage(
        "To, ka sake zabar package ko ka turo sabon lambar waya.",
        "bot"
      );


      selectedProduct = null;

      recipientPhone = null;

      waitingForPhone = false;

      waitingForConfirmation = false;


      confirm.remove();

      cancel.remove();


      const input =
        document.getElementById("messageInput");

      input.placeholder =
        "Rubuta saƙonka...";

    };


  messages.appendChild(cancel);


  waitingForConfirmation =
    true;

}


/* =========================================
   SHOW TRANSACTION HISTORY
========================================= */

function showTransactionHistory(transactions) {
  const messages = document.getElementById("messages");

  const box = document.createElement("div");
  box.className = "message bot";
  box.style.maxWidth = "95%";

  const title = document.createElement("div");
  title.style.fontWeight = "bold";
  title.style.marginBottom = "10px";
  title.textContent = "📋 Your recent transactions";
  box.appendChild(title);

  transactions.forEach((tx, index) => {
    const item = document.createElement("div");
    item.style.padding = "9px 0";
    item.style.borderTop = index === 0 ? "none" : "1px solid #ddd";

    const date = tx.date
      ? new Date(tx.date).toLocaleString("en-NG", {
          dateStyle: "medium",
          timeStyle: "short"
        })
      : "Date unavailable";

    const status = String(tx.status || "unknown").toLowerCase();
    const statusLabel =
      status === "successful" ? "✅ Successful" :
      status === "failed" ? "❌ Failed" :
      status === "pending" ? "⏳ Pending" :
      status === "reversed" ? "↩️ Reversed" :
      "ℹ️ " + status;

    item.innerHTML =
      "<strong>" + (tx.product_name || "Data purchase") + "</strong>" +
      "<br>Amount: ₦" + Number(tx.amount || 0).toLocaleString() +
      "<br>Phone: " + (tx.phone_number || "—") +
      "<br>Status: " + statusLabel +
      "<br><small>" + date + "</small>";

    box.appendChild(item);
  });

  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;
}

/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(customMessage = null) {

  const input =
    document.getElementById("messageInput");

  const button =
    document.getElementById("sendButton");


  const message =
    customMessage ||
    input.value.trim();


  if (!message) return;


  /* =========================================
     PHONE NUMBER STAGE
  ========================================= */

  if (
    waitingForPhone &&
    !customMessage
  ) {

    const phone =
      validatePhone(message);


    addMessage(
      message,
      "user"
    );


    input.value = "";


    if (!phone) {

      addMessage(
        `Lambar wayar ba ta dace ba.

Ka shigar da lambar Najeriya mai lamba 11.

Misali: 08012345678`,
        "bot"
      );


      input.focus();

      return;

    }


    recipientPhone =
      phone;


    waitingForPhone =
      false;


    showConfirmation();


    input.placeholder =
      "Rubuta saƙonka...";


    input.focus();

    return;

  }


  /* =========================================
     NORMAL MESSAGE
  ========================================= */

  if (!customMessage) {

    addMessage(
      message,
      "user"
    );

    input.value = "";

  }


  button.disabled = true;


  /* =========================================
     LOADING
  ========================================= */

  const messages =
    document.getElementById("messages");

  const loading =
    document.createElement("div");

  loading.className =
    "message bot";

  loading.textContent =
    "Ana tunani...";


  messages.appendChild(loading);

  messages.scrollTop =
    messages.scrollHeight;


  try {

    /* =========================================
       SEND TO SUPABASE
    ========================================= */

    const response = await callEdgeFunction({
      message: message
    });

    /* Read the raw response first so we never
       lose the real backend error. */
    const rawText = await response.text();

    let data = null;

    try {
      data = rawText ? JSON.parse(rawText) : null;
    } catch (parseError) {
      data = {
        error: "Backend returned a non-JSON response.",
        raw_response: rawText
      };
    }

    loading.remove();

    /* =========================================
       SHOW ACTUAL BACKEND RESPONSE / ERROR
    ========================================= */

    if (!response.ok) {

      const backendMessage =
        data?.error ||
        data?.message ||
        data?.answer ||
        data?.raw_response ||
        "No error message was returned by the backend.";

      addMessage(
        "❌ Backend error (HTTP " +
        response.status +
        "):\\n" +
        backendMessage,
        "bot"
      );

      console.error("Bindawasub AI backend error:", {
        status: response.status,
        statusText: response.statusText,
        response: data
      });

      return;
    }

    if (data?.answer) {

      addMessage(
        data.answer,
        "bot"
      );

    } else if (data?.error) {

      addMessage(
        "⚠️ Backend response: " +
        data.error,
        "bot"
      );

      console.error("Bindawasub AI backend response error:", data);

    } else if (data) {

      addMessage(
        "Backend response received:\\n" +
        JSON.stringify(
          data,
          null,
          2
        ),
        "bot"
      );

      console.log("Bindawasub AI backend response:", data);

    } else {

      addMessage(
        "⚠️ Backend returned an empty response.",
        "bot"
      );

      console.error(
        "Bindawasub AI returned an empty response."
      );

    }

    /* =========================================
       SHOW TRANSACTION HISTORY
    ========================================= */

    if (
      data?.transactions &&
      Array.isArray(data.transactions) &&
      data.transactions.length > 0
    ) {
      showTransactionHistory(data.transactions);
    }

    /* =========================================
       SHOW PACKAGES
    ========================================= */

    if (
      data?.products &&
      data.products.length > 0
    ) {

      showProducts(
        data.products
      );

    }

  } catch (error) {

    loading.remove();

    const errorMessage =
      error?.message ||
      String(error) ||
      "Unknown frontend error.";

    addMessage(
      "❌ Frontend error:\\n" +
      errorMessage,
      "bot"
    );

    console.error(
      "Bindawasub AI frontend error:",
      error
    );

  }

  button.disabled = false;

  input.focus();

  messages.scrollTop =
    messages.scrollHeight;

}
