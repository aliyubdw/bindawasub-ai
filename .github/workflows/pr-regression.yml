name: PR regression tests

on:
  pull_request:
    paths:
      - "supabase/functions/bindawasub-ai/**"
      - "supabase/functions/telegram-webhook/**"
      - ".github/workflows/pr-regression.yml"
  workflow_dispatch:

jobs:
  unscoped-data-purchase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run mock-only regression tests
        run: deno test --allow-read supabase/functions/bindawasub-ai/ai/unscoped-data-purchase_test.ts
      - name: Run end-to-end mock tests (web/app chat backend and Telegram)
        run: deno test --no-check --allow-read --allow-env --import-map=supabase/functions/bindawasub-ai/tests/harness/import_map.json supabase/functions/bindawasub-ai/tests/
      - name: Run Node routing regression tests
        run: node --test tests/natural-language-routing.test.mjs
