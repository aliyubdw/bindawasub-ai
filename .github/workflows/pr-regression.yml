name: PR regression tests

on:
  pull_request:
    paths:
      - "supabase/functions/bindawasub-ai/**"
      - "supabase/functions/telegram-webhook/**"
      - ".github/workflows/pr-regression.yml"
  workflow_dispatch:

jobs:
  unscoped-data-purchase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run mock-only regression tests
        run: deno test --allow-read supabase/functions/bindawasub-ai/ai/unscoped-data-purchase_test.ts
